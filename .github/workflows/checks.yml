name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m unittest discover -s backend/tests
      - run: python scripts/check_full_alignment.py
      - run: python scripts/run_answer_regression.py
      - run: python scripts/replay_answer_regression.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose with placeholder configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the production image
        run: docker build --tag insuretutor:ci .
      - name: Missing key must stop startup
        run: |
          if docker run --rm insuretutor:ci; then
            echo 'Startup unexpectedly succeeded without an API key.' >&2
            exit 1
          fi
      - name: Check built UI, HTTP routes and PDF without provider calls
        # Bypass indexing only for this unpaid HTTP smoke test. RAG must remain unready.
        run: |
          docker run --detach --name insuretutor-ci --publish 127.0.0.1:8768:8000 \
            --entrypoint python insuretutor:ci -m uvicorn app.main:app \
            --app-dir backend --host 0.0.0.0 --port 8000 --no-access-log
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8768/health/live > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/check_local.py --base http://127.0.0.1:8768
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8768/health/ready)" = '503'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs insuretutor-ci 2>/dev/null || true
          docker rm --force insuretutor-ci 2>/dev/null || true
