<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">InsureTutor 资料准备与问答流程</title><desc id="desc">离线资料解析、对齐、分块和向量化；在线安全检查、追问解析、检索、生成、核对后展示并保存。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8c9ba8"/></marker></defs><rect width="1400" height="980" rx="24" fill="#f5f7fa"/><g font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif'><text x="40" y="44" fill="#267f77" font-size="15" font-weight="650">INSURETUTOR / ANSWER PIPELINE</text><text x="40" y="89" fill="#243346" font-size="34" font-weight="700">先保留依据，再组织回答</text><text x="40" y="124" fill="#627181" font-size="18" font-weight="400">回答与引用经过检查后一起展示；SSE 在等待期间发送处理进度。</text><text x="40" y="177" fill="#243346" font-size="20" font-weight="650">01  资料准备 / 建库时执行</text><rect x="40" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="240" fill="#fff" font-size="16" font-weight="600">A</text><text x="60" y="285" fill="#243346" font-size="23" font-weight="650">产品 PDF</text><text x="60" y="320" fill="#627181" font-size="17" font-weight="400">20 个实际页码</text><text x="60" y="349" fill="#627181" font-size="17" font-weight="400">原始英文 + 繁体中文</text><path d="M280 286 H304" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="330" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="339" y="240" fill="#fff" font-size="16" font-weight="600">B</text><text x="330" y="285" fill="#243346" font-size="23" font-weight="650">解析与补救</text><text x="330" y="320" fill="#627181" font-size="17" font-weight="400">MinerU JSON</text><text x="330" y="349" fill="#627181" font-size="17" font-weight="400">PyMuPDF + 原文核对</text><path d="M550 286 H574" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="600" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="609" y="240" fill="#fff" font-size="16" font-weight="600">C</text><text x="600" y="285" fill="#243346" font-size="23" font-weight="650">对齐与分块</text><text x="600" y="320" fill="#627181" font-size="17" font-weight="400">292 条证据 → 143 块</text><text x="600" y="349" fill="#627181" font-size="17" font-weight="400">保留脚注与跨语言关系</text><path d="M820 286 H844" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="870" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="879" y="240" fill="#fff" font-size="16" font-weight="600">D</text><text x="870" y="285" fill="#243346" font-size="23" font-weight="650">向量化</text><text x="870" y="320" fill="#627181" font-size="17" font-weight="400">text-embedding-3-large</text><text x="870" y="349" fill="#627181" font-size="17" font-weight="400">完整建库后激活版本</text><path d="M1090 286 H1114" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1120" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="1140" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="1149" y="240" fill="#fff" font-size="16" font-weight="600">E</text><text x="1140" y="285" fill="#243346" font-size="23" font-weight="650">Chroma 索引</text><text x="1140" y="320" fill="#627181" font-size="17" font-weight="400">本地持久化 / cosine</text><text x="1140" y="349" fill="#627181" font-size="17" font-weight="400">重启复用已有向量</text><path d="M1240 377 V411 H873 V455" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="438" fill="#243346" font-size="20" font-weight="650">02  用户问答 / 每次请求执行</text><rect x="40" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="496" fill="#fff" font-size="16" font-weight="600">1</text><text x="60" y="541" fill="#243346" font-size="23" font-weight="650">问题进入</text><text x="60" y="576" fill="#627181" font-size="17" font-weight="400">Vue 界面 → FastAPI</text><text x="60" y="605" fill="#627181" font-size="17" font-weight="400">自动识别回答语言</text><text x="60" y="634" fill="#627181" font-size="17" font-weight="400">浏览器凭证隔离会话</text><path d="M340 568 H374" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="400" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="409" y="496" fill="#fff" font-size="16" font-weight="600">2</text><text x="400" y="541" fill="#243346" font-size="23" font-weight="650">范围与上下文</text><text x="400" y="576" fill="#627181" font-size="17" font-weight="400">输入安全 / 范围检查</text><text x="400" y="605" fill="#627181" font-size="17" font-weight="400">单会话追问解析</text><text x="400" y="634" fill="#627181" font-size="17" font-weight="400">必要时请求澄清</text><path d="M680 568 H714" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="740" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="749" y="496" fill="#fff" font-size="16" font-weight="600">3</text><text x="740" y="541" fill="#243346" font-size="23" font-weight="650">查找原文</text><text x="740" y="576" fill="#627181" font-size="17" font-weight="400">问题向量 → Top-5</text><text x="740" y="605" fill="#627181" font-size="17" font-weight="400">补回关联正文与脚注</text><text x="740" y="634" fill="#627181" font-size="17" font-weight="400">保留冲突字段与来源</text><path d="M1020 568 H1054" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="1080" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="1089" y="496" fill="#fff" font-size="16" font-weight="600">4</text><text x="1080" y="541" fill="#243346" font-size="23" font-weight="650">生成并核对</text><text x="1080" y="576" fill="#627181" font-size="17" font-weight="400">LLM 选择证据 ID</text><text x="1080" y="605" fill="#627181" font-size="17" font-weight="400">校验引用与保险条件</text><text x="1080" y="634" fill="#627181" font-size="17" font-weight="400">模型核对依据支持</text><path d="M1210 683 V731" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="740" width="300" height="184" rx="16" fill="#eaf5f2" stroke="#beddd5"/><text x="1080" y="777" fill="#215e58" font-size="23" font-weight="650">已核对的最终结果</text><text x="1080" y="816" fill="#627181" font-size="17" font-weight="400">正文 + 可点击 PDF 引用</text><text x="1080" y="845" fill="#627181" font-size="17" font-weight="400">处理耗时与 tokens</text><text x="1080" y="874" fill="#627181" font-size="17" font-weight="400">失败时给出说明或澄清</text><rect x="40" y="740" width="600" height="184" rx="16" fill="#fff" stroke="#dfe6ec"/><text x="60" y="778" fill="#243346" font-size="23" font-weight="650">SQLite / 每个聊天独立保存</text><text x="60" y="818" fill="#627181" font-size="18" font-weight="400">保存问题、最终答案、引用、指标与聊天名称</text><text x="60" y="850" fill="#627181" font-size="18" font-weight="400">追问使用有限上下文；每次仍重新检索原文</text><text x="60" y="882" fill="#627181" font-size="18" font-weight="400">Docker 数据卷持久化，重启后可以继续聊天</text><path d="M1060 829 H646" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 740 V689" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><text x="696" y="783" fill="#267f77" font-size="20" font-weight="650">SSE 状态更新</text><text x="696" y="820" fill="#627181" font-size="18" font-weight="400">查找 → 整理 → 核对</text><text x="696" y="854" fill="#627181" font-size="18" font-weight="400">草稿留在服务端</text><text x="696" y="887" fill="#627181" font-size="18" font-weight="400">前端逐字呈现最终正文</text><text x="40" y="953" fill="#627181" font-size="16" font-weight="400">引用页码包含封面；简体回答来自已对齐资料，引用保留原文语言。</text></g></svg>