<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">InsureTutor knowledge preparation and answer pipeline</title><desc id="desc">Parse, align, chunk and embed the brochure; check scope, resolve follow-ups, retrieve evidence, generate and verify before displaying and saving.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8c9ba8"/></marker></defs><rect width="1400" height="980" rx="24" fill="#f5f7fa"/><g font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif'><text x="40" y="44" fill="#267f77" font-size="15" font-weight="650">INSURETUTOR / ANSWER PIPELINE</text><text x="40" y="89" fill="#243346" font-size="34" font-weight="700">Evidence first, then answers</text><text x="40" y="124" fill="#627181" font-size="18" font-weight="400">Show verified answers and citations together; SSE reports progress while waiting.</text><text x="40" y="177" fill="#243346" font-size="20" font-weight="650">01  Prepare the knowledge base</text><rect x="40" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="240" fill="#fff" font-size="16" font-weight="600">A</text><text x="60" y="285" fill="#243346" font-size="23" font-weight="650">Product PDF</text><text x="60" y="320" fill="#627181" font-size="17" font-weight="400">20 physical pages</text><text x="60" y="349" fill="#627181" font-size="17" font-weight="400">English + Chinese (Hant)</text><path d="M280 286 H304" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="330" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="339" y="240" fill="#fff" font-size="16" font-weight="600">B</text><text x="330" y="285" fill="#243346" font-size="23" font-weight="650">Parse and review</text><text x="330" y="320" fill="#627181" font-size="17" font-weight="400">MinerU JSON</text><text x="330" y="349" fill="#627181" font-size="17" font-weight="400">PyMuPDF + source checks</text><path d="M550 286 H574" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="600" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="609" y="240" fill="#fff" font-size="16" font-weight="600">C</text><text x="600" y="285" fill="#243346" font-size="23" font-weight="650">Align and chunk</text><text x="600" y="320" fill="#627181" font-size="17" font-weight="400">292 sources → 143 chunks</text><text x="600" y="349" fill="#627181" font-size="17" font-weight="400">Link footnotes / translations</text><path d="M820 286 H844" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="870" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="879" y="240" fill="#fff" font-size="16" font-weight="600">D</text><text x="870" y="285" fill="#243346" font-size="23" font-weight="650">Embed</text><text x="870" y="320" fill="#627181" font-size="17" font-weight="400">text-embedding-3-large</text><text x="870" y="349" fill="#627181" font-size="17" font-weight="400">Activate completed builds</text><path d="M1090 286 H1114" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1120" y="199" width="240" height="178" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="1140" y="219" width="36" height="30" rx="8" fill="#267f77"/><text x="1149" y="240" fill="#fff" font-size="16" font-weight="600">E</text><text x="1140" y="285" fill="#243346" font-size="23" font-weight="650">Chroma index</text><text x="1140" y="320" fill="#627181" font-size="17" font-weight="400">Persistent / cosine</text><text x="1140" y="349" fill="#627181" font-size="17" font-weight="400">Reuse vectors on restart</text><path d="M1240 377 V411 H873 V455" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="438" fill="#243346" font-size="20" font-weight="650">02  Answer each question</text><rect x="40" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="496" fill="#fff" font-size="16" font-weight="600">1</text><text x="60" y="541" fill="#243346" font-size="23" font-weight="650">Question → API</text><text x="60" y="576" fill="#627181" font-size="17" font-weight="400">Vue interface → FastAPI</text><text x="60" y="605" fill="#627181" font-size="17" font-weight="400">Detect response language</text><text x="60" y="634" fill="#627181" font-size="17" font-weight="400">Browser-isolated chats</text><path d="M340 568 H374" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="400" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="409" y="496" fill="#fff" font-size="16" font-weight="600">2</text><text x="400" y="541" fill="#243346" font-size="23" font-weight="650">Scope and context</text><text x="400" y="576" fill="#627181" font-size="17" font-weight="400">Input / scope checks</text><text x="400" y="605" fill="#627181" font-size="17" font-weight="400">Resolve within-chat follow-ups</text><text x="400" y="634" fill="#627181" font-size="17" font-weight="400">Clarify when ambiguous</text><path d="M680 568 H714" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="740" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="749" y="496" fill="#fff" font-size="16" font-weight="600">3</text><text x="740" y="541" fill="#243346" font-size="23" font-weight="650">Find evidence</text><text x="740" y="576" fill="#627181" font-size="17" font-weight="400">Query vector → Top-5</text><text x="740" y="605" fill="#627181" font-size="17" font-weight="400">Expand linked conditions</text><text x="740" y="634" fill="#627181" font-size="17" font-weight="400">Keep conflicts and sources</text><path d="M1020 568 H1054" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="455" width="300" height="228" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="1080" y="475" width="36" height="30" rx="8" fill="#267f77"/><text x="1089" y="496" fill="#fff" font-size="16" font-weight="600">4</text><text x="1080" y="541" fill="#243346" font-size="23" font-weight="650">Generate and check</text><text x="1080" y="576" fill="#627181" font-size="17" font-weight="400">LLM selects evidence IDs</text><text x="1080" y="605" fill="#627181" font-size="17" font-weight="400">Validate IDs and conditions</text><text x="1080" y="634" fill="#627181" font-size="17" font-weight="400">Model checks source support</text><path d="M1210 683 V731" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="740" width="300" height="184" rx="16" fill="#eaf5f2" stroke="#beddd5"/><text x="1080" y="777" fill="#215e58" font-size="23" font-weight="650">Verified result</text><text x="1080" y="816" fill="#627181" font-size="17" font-weight="400">Answer + clickable PDF sources</text><text x="1080" y="845" fill="#627181" font-size="17" font-weight="400">Timings and token usage</text><text x="1080" y="874" fill="#627181" font-size="17" font-weight="400">Explain failures / ask to clarify</text><rect x="40" y="740" width="600" height="184" rx="16" fill="#fff" stroke="#dfe6ec"/><text x="60" y="778" fill="#243346" font-size="23" font-weight="650">SQLite / separate chat histories</text><text x="60" y="818" fill="#627181" font-size="18" font-weight="400">Save questions, final answers, citations and metrics</text><text x="60" y="850" fill="#627181" font-size="18" font-weight="400">Bounded context; retrieve fresh sources for every reply</text><text x="60" y="882" fill="#627181" font-size="18" font-weight="400">Docker volume preserves chats across restarts</text><path d="M1060 829 H646" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 740 V689" fill="none" stroke="#8c9ba8" stroke-width="2" marker-end="url(#arrow)"/><text x="696" y="783" fill="#267f77" font-size="20" font-weight="650">SSE progress</text><text x="696" y="820" fill="#627181" font-size="18" font-weight="400">Retrieve → Generate → Check</text><text x="696" y="854" fill="#627181" font-size="18" font-weight="400">Drafts stay on the server</text><text x="696" y="887" fill="#627181" font-size="18" font-weight="400">Reveal verified text gradually</text><text x="40" y="953" fill="#627181" font-size="16" font-weight="400">PDF page numbers include the cover. Simplified Chinese replies use aligned evidence; quotations retain their language.</text></g></svg>