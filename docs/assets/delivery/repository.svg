<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">InsureTutor 代码仓库结构</title><desc id="desc">前端、后端、资料、评测及部署文档的职责与目录。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8c9ba8"/></marker></defs><rect width="1400" height="820" rx="24" fill="#f5f7fa"/><g font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif'><text x="40" y="44" fill="#267f77" font-size="15" font-weight="650">INSURETUTOR / REPOSITORY</text><text x="40" y="89" fill="#243346" font-size="34" font-weight="700">代码按职责组织，数据和评测独立保存</text><text x="40" y="124" fill="#627181" font-size="18" font-weight="400">Vue 3 + TypeScript  ·  FastAPI + Python  ·  Chroma + SQLite</text><rect x="40" y="153" width="1320" height="56" rx="16" fill="#243346" stroke="#243346"/><text x="66" y="190" fill="#fff" font-size="23" font-weight="650">InsureTutor/</text><text x="335" y="189" fill="#dbe5ee" font-size="18" font-weight="400">单仓库 · 一个 Docker 服务 · 两个持久化数据卷</text><rect x="40" y="244" width="420" height="255" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="264" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="285" fill="#fff" font-size="16" font-weight="600">01</text><text x="60" y="330" fill="#243346" font-size="23" font-weight="650">frontend/</text><text x="60" y="365" fill="#627181" font-size="17" font-weight="400">src/App.vue · 聊天与会话列表</text><text x="60" y="394" fill="#627181" font-size="17" font-weight="400">src/components/ · 性能图表</text><text x="60" y="423" fill="#627181" font-size="17" font-weight="400">src/api/ · SSE 与请求指标</text><text x="60" y="469" fill="#267f77" font-size="17" font-weight="650">用户界面</text><rect x="490" y="244" width="420" height="255" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="510" y="264" width="36" height="30" rx="8" fill="#267f77"/><text x="519" y="285" fill="#fff" font-size="16" font-weight="600">02</text><text x="510" y="330" fill="#243346" font-size="23" font-weight="650">backend/</text><text x="510" y="365" fill="#627181" font-size="17" font-weight="400">app/main.py · API / PDF / 健康检查</text><text x="510" y="394" fill="#627181" font-size="17" font-weight="400">app/rag/ · 索引与检索</text><text x="510" y="423" fill="#627181" font-size="17" font-weight="400">app/services/ · 生成、核对与记忆</text><text x="510" y="469" fill="#267f77" font-size="17" font-weight="650">问答服务</text><rect x="940" y="244" width="420" height="255" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="960" y="264" width="36" height="30" rx="8" fill="#267f77"/><text x="969" y="285" fill="#fff" font-size="16" font-weight="600">03</text><text x="960" y="330" fill="#243346" font-size="23" font-weight="650">data/</text><text x="960" y="365" fill="#627181" font-size="17" font-weight="400">processed/ · 证据和分块</text><text x="960" y="394" fill="#627181" font-size="17" font-weight="400">reviewed/ · 对齐及修正记录</text><text x="960" y="423" fill="#627181" font-size="17" font-weight="400">chroma/ + history/ · 运行时数据</text><text x="960" y="469" fill="#267f77" font-size="17" font-weight="650">知识与运行数据</text><rect x="40" y="525" width="420" height="238" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="60" y="545" width="36" height="30" rx="8" fill="#267f77"/><text x="69" y="566" fill="#fff" font-size="16" font-weight="600">04</text><text x="60" y="611" fill="#243346" font-size="23" font-weight="650">evaluation/</text><text x="60" y="646" fill="#627181" font-size="17" font-weight="400">固定题目、参考证据、真实报告</text><text x="60" y="675" fill="#627181" font-size="17" font-weight="400">backend/tests/ · 离线接口与逻辑</text><text x="60" y="704" fill="#627181" font-size="17" font-weight="400">frontend/tests/ · 图表与流处理</text><text x="60" y="741" fill="#267f77" font-size="17" font-weight="650">效果验证</text><rect x="490" y="525" width="420" height="238" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="510" y="545" width="36" height="30" rx="8" fill="#267f77"/><text x="519" y="566" fill="#fff" font-size="16" font-weight="600">05</text><text x="510" y="611" fill="#243346" font-size="23" font-weight="650">scripts/ + Docker</text><text x="510" y="646" fill="#627181" font-size="17" font-weight="400">scripts/start.sh · 一键启动</text><text x="510" y="675" fill="#627181" font-size="17" font-weight="400">Dockerfile + docker-compose.yml</text><text x="510" y="704" fill="#627181" font-size="17" font-weight="400">.github/workflows/ · CI</text><text x="510" y="741" fill="#267f77" font-size="17" font-weight="650">启动与自动检查</text><rect x="940" y="525" width="420" height="238" rx="16" fill="#fff" stroke="#dfe6ec"/><rect x="960" y="545" width="36" height="30" rx="8" fill="#267f77"/><text x="969" y="566" fill="#fff" font-size="16" font-weight="600">06</text><text x="960" y="611" fill="#243346" font-size="23" font-weight="650">docs/ + README</text><text x="960" y="646" fill="#627181" font-size="17" font-weight="400">原始 PDF · 题目要求</text><text x="960" y="675" fill="#627181" font-size="17" font-weight="400">EXECUTION.md · 开发过程</text><text x="960" y="704" fill="#627181" font-size="17" font-weight="400">DELIVERY.zh-CN.md · 交付说明</text><text x="960" y="741" fill="#267f77" font-size="17" font-weight="650">交付与设计记录</text><text x="40" y="795" fill="#627181" font-size="16" font-weight="400">不提交：真实 .env、个人聊天库、本地向量库、raw 导出；Docker 卷分别保存索引与聊天。</text></g></svg>